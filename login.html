<!DOCTYPE html>
<html>
<head>
    <title>AIMERS | Login</title>
    <link rel="icon" type="image/png" href="aimers-removebg-preview.png">
    <style>    
        body {
            background: #0f2027;
            background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
            color: #fff;
            display: flex; /* Added to center everything */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }
        .form-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            text-align: center;
        }
        input[type="password"] {
            padding: 12px;
            border-radius: 5px;
            border: none;
            width: 250px;
            font-size: 1rem;
        }
        button {
            margin-top: 20px;
            padding: 10px 25px;
            border-radius: 5px;
            background: #00eaff;
            color: #000;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h1 style="margin-bottom: 20px;">Enter PIN</h1>
    <input type="password" id="pin" placeholder="Enter PIN">
    <br>
    <button type="button" onclick="login()">Login</button>
</div>

<script src="script.js"></script>

</body>
</html>
